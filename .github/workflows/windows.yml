name: Windows package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install . -r requirements-build.txt
          if ($LASTEXITCODE) { throw 'Installation failed' }
      - name: Safety and resume tests
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { throw 'Safety tests failed' }
      - name: Validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = python -c "import importlib.metadata; print(importlib.metadata.version('photosort-tool'))"
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Release tag must match pyproject.toml version' }
      - name: Build Windows EXEs
        run: ./build-windows.ps1
      - name: Package ZIP and checksum
        run: ./package-windows.ps1
      - name: Test extracted package
        run: |
          python scripts/smoke-windows.py (Get-ChildItem dist/PhotoSort-*-windows-x64.zip).FullName
          if ($LASTEXITCODE) { throw 'Package smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSort-windows-x64
          path: |
            dist/PhotoSort-*-windows-x64.zip
            dist/PhotoSort-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PhotoSort-windows-x64
          path: package
      - name: Attach tested assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" package/*.zip package/*.sha256
